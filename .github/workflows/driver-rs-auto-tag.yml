name: driver-rs auto tag

on:
  push:
    branches: [main]
    paths:
      - "driver-rs/**"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from Cargo.toml
        id: version
        working-directory: driver-rs
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check if release tag already exists
        id: check
        run: |
          tag="driver-rs-v${{ steps.version.outputs.version }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "refs/tags/$tag$"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag release
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.check.outputs.tag }}" -m "${{ steps.check.outputs.tag }}"
          git push origin "${{ steps.check.outputs.tag }}"
