[package]
name = "flipdot-driver"
version = "0.1.0"
edition = "2021"
description = "FlipDot display driver (Rust port)"
license = "MIT"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
